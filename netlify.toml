[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/blog/franchise-en-base-de-tva-2026"
  to = "/blog/franchise-tva-2026-seuils-et-regles"
  status = 301
  force = true

[[redirects]]
  from = "/blog/calcul-cotisations-urssaf-bnc-2026"
  to = "/blog/calcul-cotisations-urssaf-bnc-bic"
  status = 301
  force = true

[[redirects]]
  from = "/cgv"
  to = "/cgu"
  status = 301
  force = true

[[redirects]]
  from = "/blog/obligation-de-facturation-electronique-pour-les-auto-entrepreneurs-echeances-impacts-et-mise-en-conformite"
  to = "/blog/obligation-facturation-electronique-auto-entrepreneur"
  status = 301
  force = true

[[redirects]]
  from = "/blog/logiciel-de-facturation-pour-micro-entrepreneur-conforme-securiser-sa-croissance-et-anticiper-2026"
  to = "/blog/logiciel-facturation-micro-entrepreneur-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/comment-automatiser-sa-declaration-urssaf-d-auto-entrepreneur-pour-optimiser-sa-tresorerie"
  to = "/blog/automatiser-declaration-urssaf-auto-entrepreneur"
  status = 301
  force = true

[[redirects]]
  from = "/blog/modele-devis-facture-artisan-batiment-gratuit-les-risques-caches-pour-votre-tresorerie"
  to = "/blog/devis-facture-artisan-batiment-risques"
  status = 301
  force = true

# Fallback SPA pour les routes dynamiques et privées sans fichier pré-rendu (/dashboard, /invoices, /settings, etc.)
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200
  force = false

[[headers]]
  for = "/v/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
